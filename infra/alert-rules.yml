groups:
  - name: sample-shop
    rules:
      - alert: ShopHttpErrorRate
        expr: sum by(service)(rate(http_server_requests_seconds_count{uri=~"/api/.*",status=~"5.."}[1m])) / sum by(service)(rate(http_server_requests_seconds_count{uri=~"/api/.*"}[1m])) > 0.1
        for: 15s
        labels: {severity: critical, environment: staging}
        annotations: {summary: '业务 HTTP 5xx 持续超过 10%'}
      - alert: ShopHttpLatency
        expr: histogram_quantile(0.95,sum by(service,le)(rate(http_server_requests_seconds_bucket{uri=~"/api/.*"}[1m]))) > 1
        for: 15s
        labels: {severity: warning, environment: staging}
        annotations: {summary: '业务 P95 持续超过 1 秒'}
      - alert: ShopInstanceDown
        expr: up == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: '实例指标不可抓取'}
      - alert: ShopPoolPressure
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'Hikari 连接池占用超过 80%'}
      - alert: ShopFulfillmentBacklog
        expr: max by(service)(shop_orders_waiting) > 5
        for: 10s
        labels: {severity: warning, environment: staging}
        annotations: {summary: '真实订单待备货积压超过 5 单'}
      - alert: ShopOutboxBacklog
        expr: max by(service)(shop_outbox_pending) > 5
        for: 10s
        labels: {severity: warning, environment: staging}
        annotations: {summary: '真实数据库消息待发送积压超过 5 条'}
      - alert: ShopBusinessMetricsStale
        expr: shop_business_sample_age_seconds > 15
        for: 5s
        labels: {severity: warning}
        annotations: {summary: '数据库业务指标超过 15 秒未更新'}
