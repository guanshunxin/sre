global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/alert-rules.yml]
scrape_configs:
  - job_name: sample-shop
    metrics_path: /actuator/prometheus
    authorization: {credentials_file: /etc/prometheus/metrics-token}
    static_configs:
      - targets: [shop-a:8080, shop-b:8080]
        labels: {service: shop-api, environment: staging}
  - job_name: delivery-api
    metrics_path: /actuator/prometheus
    authorization: {credentials_file: /etc/prometheus/metrics-token}
    static_configs:
      - targets: [delivery-api:8080]
        labels: {service: delivery-api, environment: staging}
